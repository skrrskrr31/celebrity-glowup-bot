name: Celeb News Bot
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg fonts-dejavu
      - run: pip install -r requirements.txt
      - name: Run
        env:
          TOKEN_JSON:         ${{ secrets.TOKEN_JSON }}
          SECRET_JSON:        ${{ secrets.SECRET_JSON }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          JAMENDO_CLIENT_ID:  ${{ secrets.JAMENDO_CLIENT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python celeb_news_bot.py
      - name: Save history
        run: |
          git config user.name  "Celeb News Bot"
          git config user.email "bot@github.com"
          git add kullanilan_haberler.json run_log.json || true
          git diff --staged --quiet || git commit -m "chore: update history [skip ci]"
          git push origin HEAD
